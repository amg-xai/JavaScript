<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Game (Bat, Ball, Stump) - React + Tailwind CSS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel CDN (to compile JSX in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

  <div id="root" class="w-full max-w-xl"></div>

  <!-- React Code with Tailwind CSS -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    const CHOICES = [
      { id: 'Bat', label: 'Bat', icon: '🏏', beats: 'Ball', desc: 'Bat hits Ball!' },
      { id: 'Ball', label: 'Ball', icon: '⚾', beats: 'Stump', desc: 'Ball knocks down Stump!' },
      { id: 'Stump', label: 'Stump', icon: '🪵', beats: 'Bat', desc: 'Stump dismisses Bat!' }
    ];

    function CricketApp() {
      // Score state loaded from localStorage
      const [score, setScore] = useState(() => {
        const saved = localStorage.getItem('cricket_score');
        return saved ? JSON.parse(saved) : { won: 0, lost: 0, tie: 0 };
      });

      const [userChoice, setUserChoice] = useState(null);
      const [compChoice, setCompChoice] = useState(null);
      const [result, setResult] = useState(null);
      const [message, setMessage] = useState('Select your play to begin!');

      // Save score to localStorage
      useEffect(() => {
        localStorage.setItem('cricket_score', JSON.stringify(score));
      }, [score]);

      const playRound = (selectedChoice) => {
        const randomChoice = CHOICES[Math.floor(Math.random() * CHOICES.length)];
        setUserChoice(selectedChoice);
        setCompChoice(randomChoice);

        if (selectedChoice.id === randomChoice.id) {
          setResult('tie');
          setMessage(`Both chose ${selectedChoice.id}. It's a Tie! 🤝`);
          setScore(prev => ({ ...prev, tie: prev.tie + 1 }));
        } else if (selectedChoice.beats === randomChoice.id) {
          setResult('won');
          setMessage(`Awesome! ${selectedChoice.desc} You Won! 🎉`);
          setScore(prev => ({ ...prev, won: prev.won + 1 }));
        } else {
          setResult('lost');
          setMessage(`Oops! ${randomChoice.desc} Computer Won! 💥`);
          setScore(prev => ({ ...prev, lost: prev.lost + 1 }));
        }
      };

      const resetScore = () => {
        const initial = { won: 0, lost: 0, tie: 0 };
        setScore(initial);
        setUserChoice(null);
        setCompChoice(null);
        setResult(null);
        setMessage('Score reset! Make your first move.');
      };

      return (
        <div className="bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-6 sm:p-8 text-center">
          {/* Title */}
          <h1 className="text-3xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500 mb-2">
            🏏 Cricket Showdown
          </h1>
          <p className="text-slate-400 text-sm mb-6">Bat beats Ball • Ball beats Stump • Stump beats Bat</p>

          {/* Choices Buttons */}
          <div className="grid grid-cols-3 gap-4 mb-8">
            {CHOICES.map((item) => (
              <button
                key={item.id}
                onClick={() => playRound(item)}
                className="flex flex-col items-center justify-center p-4 bg-slate-700/60 hover:bg-emerald-600 hover:scale-105 active:scale-95 border border-slate-600 rounded-xl transition-all duration-200 cursor-pointer shadow-md group"
              >
                <span className="text-4xl mb-2 group-hover:scale-110 transition-transform">{item.icon}</span>
                <span className="font-semibold text-slate-200 group-hover:text-white">{item.label}</span>
              </button>
            ))}
          </div>

          {/* Battle Arena (Choices Display) */}
          {userChoice && compChoice && (
            <div className="bg-slate-900/80 rounded-xl p-5 mb-6 border border-slate-700/80">
              <div className="flex justify-around items-center">
                <div className="text-center">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">You</span>
                  <div className="text-4xl">{userChoice.icon}</div>
                  <span className="text-sm font-medium text-slate-300 mt-1 block">{userChoice.label}</span>
                </div>

                <div className="text-xl font-bold text-slate-500">VS</div>

                <div className="text-center">
                  <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Computer</span>
                  <div className="text-4xl">{compChoice.icon}</div>
                  <span className="text-sm font-medium text-slate-300 mt-1 block">{compChoice.label}</span>
                </div>
              </div>

              {/* Result Banner */}
              <div className={`mt-4 py-2 px-4 rounded-lg font-semibold text-sm ${
                result === 'won' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' :
                result === 'lost' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40' :
                'bg-amber-500/20 text-amber-400 border border-amber-500/40'
              }`}>
                {message}
              </div>
            </div>
          )}

          {/* Scoreboard */}
          <div className="bg-slate-900/60 rounded-xl p-4 border border-slate-700/50 mb-6">
            <h3 className="text-xs uppercase tracking-wider font-bold text-slate-400 mb-3">Live Scoreboard</h3>
            <div className="grid grid-cols-3 gap-2">
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                <p className="text-xs text-emerald-400 font-medium">Won</p>
                <p className="text-2xl font-bold">{score.won}</p>
              </div>
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                <p className="text-xs text-rose-400 font-medium">Lost</p>
                <p className="text-2xl font-bold">{score.lost}</p>
              </div>
              <div className="bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                <p className="text-xs text-amber-400 font-medium">Tie</p>
                <p className="text-2xl font-bold">{score.tie}</p>
              </div>
            </div>
          </div>

          {/* Reset Button */}
          <button
            onClick={resetScore}
            className="text-xs text-slate-400 hover:text-rose-400 transition-colors uppercase font-bold tracking-wider py-1 px-3 border border-slate-700 hover:border-rose-500/50 rounded-md"
          >
            Reset Game Score
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CricketApp />);
  </script>
</body>
</html>
