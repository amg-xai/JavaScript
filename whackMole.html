
<!DOCTYPE html>
<html>
<head>
    <title>Whack-a-Mole Game</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #d9f7be;
        }

        h1 {
            color: #245c32;
        }

        .game {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 15px;
            justify-content: center;
            margin: 30px;
        }

        .hole {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #795548;
            font-size: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background-color: #2e8b57;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🐹 Whack-a-Mole!</h1>

    <h2>Score: <span id="score">0</span></h2>
    <h3>Time: <span id="time">30</span> seconds</h3>

    <button onclick="startGame()">Start Game</button>

    <div class="game">
        <div class="hole" onclick="whack(0)"></div>
        <div class="hole" onclick="whack(1)"></div>
        <div class="hole" onclick="whack(2)"></div>
        <div class="hole" onclick="whack(3)"></div>
        <div class="hole" onclick="whack(4)"></div>
        <div class="hole" onclick="whack(5)"></div>
        <div class="hole" onclick="whack(6)"></div>
        <div class="hole" onclick="whack(7)"></div>
        <div class="hole" onclick="whack(8)"></div>
    </div>

    <p id="message">Click Start Game to play!</p>

    <script>
        let score = 0;
        let time = 30;
        let mole = -1;
        let playing = false;
        let timer;
        let moleTimer;

        let holes = document.querySelectorAll(".hole");

        function showMole() {
            holes.forEach(function(hole) {
                hole.textContent = "";
            });

            mole = Math.floor(Math.random() * 9);
            holes[mole].textContent = "🐹";
        }

        function whack(number) {
            if (playing && number === mole) {
                score++;
                document.getElementById("score").textContent = score;
                showMole();
            }
        }

        function startGame() {
            clearInterval(timer);
            clearInterval(moleTimer);

            score = 0;
            time = 30;
            playing = true;

            document.getElementById("score").textContent = score;
            document.getElementById("time").textContent = time;
            document.getElementById("message").textContent = "Catch the mole!";

            showMole();

            moleTimer = setInterval(showMole, 800);

            timer = setInterval(function() {
                time--;
                document.getElementById("time").textContent = time;

                if (time <= 0) {
                    clearInterval(timer);
                    clearInterval(moleTimer);
                    playing = false;
                    mole = -1;

                    holes.forEach(function(hole) {
                        hole.textContent = "";
                    });

                    document.getElementById("message").textContent =
                        "Game over! Your score is " + score;
                }
            }, 1000);
        }
    </script>

</body>
</html>
